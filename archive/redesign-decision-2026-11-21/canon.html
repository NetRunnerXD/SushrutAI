<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:#F1F5F9;font-family:"Noto Sans",sans-serif;color:#0F172A}
.hdr{background:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #E2E8F0}
.dot{width:32px;height:32px;border-radius:10px;background:#0F766E}
.sos{margin-left:auto;background:#DC2626;color:#fff;font-weight:700;border-radius:999px;padding:9px 16px}
main{padding:16px}
h1{font-size:26px;font-weight:700;margin-bottom:14px}
.ask{background:#0F766E;color:#fff;border-radius:20px;padding:20px;text-align:center}
.ask .m{width:72px;height:72px;border-radius:50%;background:#fff3;margin:0 auto 10px}
.ask p{font-size:18px;font-weight:600}
.card{background:#fff;border-radius:16px;padding:14px;margin-top:14px;box-shadow:0 1px 3px #0f172a14}
.card h2{font-size:17px;margin-bottom:8px}
.li{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid #F1F5F9;font-size:15px}
.pill{background:#CCFBF1;color:#115E59;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600}
nav{position:absolute;bottom:0;left:0;right:0;height:68px;background:#fff;border-top:1px solid #E2E8F0;display:flex}
nav a{flex:1;display:flex;align-items:center;justify-content:center;font-size:13px;color:#64748B}
nav a.on{color:#0F766E;font-weight:700}
</style></head><body>
<div class="hdr"><span class="dot"></span><b>SushrutAI</b><span class="sos">SOS</span></div>
<main><h1>Good morning, Asha</h1>
<div class="ask"><div class="m"></div><p>Tap to speak</p></div>
<div class="card"><h2>Today's medicines</h2><div class="li">Metformin 500 mg<span class="pill">Taken</span></div><div class="li">Metformin 500 mg · 2:00 pm<span>Due</span></div><div class="li">Iron + folic · night<span>Later</span></div></div>
<div class="card"><h2>Needs attention</h2><div class="li">Haemoglobin 9.8 g/dL<span style="color:#DC2626">Low</span></div></div>
</main>
<nav><a class="on">Home</a><a>Ask</a><a>Medicines</a><a>Records</a><a>Me</a></nav>
</body></html>
