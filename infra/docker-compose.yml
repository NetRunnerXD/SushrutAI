# Optional production-like services. The API also runs without Docker (SQLite + local storage).
# Usage: docker compose -f infra/docker-compose.yml up -d
# Then set DATABASE_URL=postgresql+asyncpg://sushrut_app:sushrut_app_dev_only@localhost:5432/sushrut in .env
# (the app role is NOT a superuser, so Postgres row-level security applies to it)
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sushrut
      POSTGRES_PASSWORD: sushrut
      POSTGRES_DB: sushrut
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data", "./sql:/docker-entrypoint-initdb.d:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sushrut"]
      interval: 5s
      retries: 10

  redis:
    image: valkey/valkey:8-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sushrut
      MINIO_ROOT_PASSWORD: sushrut-minio-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio:/data"]

volumes:
  pgdata:
  minio:
