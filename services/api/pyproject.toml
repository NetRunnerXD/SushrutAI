[project]
name = "sushrutai-api"
version = "0.1.0"
description = "SushrutAI backend — voice-first Indic health information assistant"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.30",
  "aiosqlite>=0.20",
  "asyncpg>=0.29",
  "cryptography>=43",
  "pyjwt>=2.9",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "rapidfuzz>=3.9",
  "jellyfish>=1.1",
  "numpy>=1.26",
  "pillow>=10.4",
  "beautifulsoup4>=4.12",
  "lxml>=5.3",
  "pymupdf>=1.24",
  "email-validator>=2.2",
]

[project.optional-dependencies]
# Heavy local ML extras — install when you want fully-local OCR/STT
ocr = ["surya-ocr>=0.6", "opencv-python-headless>=4.10"]
stt = ["faster-whisper>=1.0"]
# Chest X-ray screening model (app/vision/specialists/chest_xray.py); CPU wheels:
#   uv pip install torchxrayvision==1.5.7 torchvision --index-url https://download.pytorch.org/whl/cpu
#     --extra-index-url https://pypi.org/simple --index-strategy unsafe-best-match
vision = ["torchxrayvision==1.5.7", "torchvision"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "respx>=0.21"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
